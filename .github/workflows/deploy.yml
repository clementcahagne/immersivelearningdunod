name: Deploy to OVH

on:
  push:
    branches: [main]
  workflow_dispatch: # bouton "Run workflow" dans l'onglet Actions

jobs:
  deploy:
    name: Deploy via SFTP to immersivelearning.pauuse.fr
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Deploy via SFTP (port 22)
        env:
          SFTP_HOST: ${{ secrets.FTP_HOST }}
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp --env-password -u "$SFTP_USER" -p 22 "sftp://$SFTP_HOST" <<'EOF'
            set sftp:auto-confirm yes
            set net:max-retries 3
            set net:timeout 30
            set net:reconnect-interval-base 5
            mirror --reverse --verbose \
              --exclude-glob .git \
              --exclude-glob .git/ \
              --exclude-glob .gitignore \
              --exclude-glob .github \
              --exclude-glob .github/ \
              --exclude-glob .claude \
              --exclude-glob .claude/ \
              --exclude-glob .DS_Store \
              --exclude-glob node_modules \
              --exclude-glob node_modules/ \
              --exclude-glob README.md \
              --exclude-glob CNAME \
              ./ ./
            bye
          EOF
