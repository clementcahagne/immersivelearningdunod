name: Deploy to OVH

on:
  push:
    branches: [main]
  workflow_dispatch: # bouton "Run workflow" dans l'onglet Actions

jobs:
  deploy:
    name: Deploy via FTPS to immersivelearning.pauuse.fr
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          security: loose # OVH shared cluster cert peut avoir un CN différent du host
          server-dir: ./   # le user pauuseh-deploy est déjà chrooté sur /www/immersivelearning/
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.claude/**
            **/.DS_Store
            **/node_modules/**
            **/README.md
            **/CNAME
